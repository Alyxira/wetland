spring.application.name=demo

# DataBase Setting
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=wetlend_db;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Setting
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# api
server.port=8080
server.servlet.context-path=/api

# Ollama
ollama.api=${OLLAMA_API:http://localhost:11434/api/chat}
ollama.model=${OLLAMA_MODEL:qwen:1.8b}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
spring.servlet.multipart.location=${user.dir}/uploads/temp
spring.servlet.multipart.file-size-threshold=2MB

server.tomcat.basedir=${user.dir}/uploads/tomcat
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

app.upload.dir=${user.dir}/uploads/tiff
app.local.images.dir=${APP_LOCAL_IMAGES_DIR:${user.dir}/uploads/local-images}
app.results.dir=${user.dir}/uploads/results
app.tiles.cache.dir=${user.dir}/uploads/tiles-cache
app.tiles.enabled=true
app.tiles.min-zoom=6
app.tiles.max-image-bytes-for-low-zoom=600000000
app.waterbody.geojson.dir=${user.dir}/waterbody-geojson
app.python.executable=${APP_PYTHON_EXECUTABLE:python}
app.python.script.path=
app.python.command-timeout-ms=30000

scenic.ai.enabled=${SCENIC_AI_ENABLED:true}
scenic.ai.base-url=${SCENIC_AI_BASE_URL:https://api.deepseek.com/chat/completions}
scenic.ai.api-key=${SCENIC_AI_API_KEY:}
scenic.ai.model=${SCENIC_AI_MODEL:deepseek-chat}
scenic.ai.system-prompt=你是小Y，是景区数字导览助手。请只输出自然、简洁的中文纯文本，不要使用Markdown，不要出现#、*、-、`、>等符号。只基于当前景区信息回答，不要扩展到其他景区。
